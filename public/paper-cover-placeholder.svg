      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#0085FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.1"/>
